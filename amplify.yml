{
  "version": 1,
  "frontend": {
    "phases": {
      "preBuild": {
        "commands": ["npm ci"]
      },
      "build": {
        "commands": ["npm run build"]
      }
    },
    "artifacts": {
      "baseDirectory": "dist",
      "files": ["**/*"]
    },
    "cache": {
      "paths": ["node_modules/**/*"]
    }
  },
  "rewrites": [
    {
      "source": "/api/<*>",
      "target": "http://deepshield-backend-env-1.eba-xrtbwy37.us-east-1.elasticbeanstalk.com/api/<*>",
      "status": "200"
    },
    {
      "source": "/<*>",
      "target": "/index.html",
      "status": "200"
    }
  ]
}
