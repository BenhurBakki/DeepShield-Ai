{
  "version": 1,
  "frontend": {
    "phases": {
      "preBuild": {
        "commands": ["npm ci"]
      },
      "build": {
        "commands": ["npm run build"]
      }
    },
    "artifacts": {
      "baseDirectory": "dist",
      "files": ["**/*"]
    },
    "cache": {
      "paths": ["node_modules/**/*"]
    }
  },
  "customHeaders": [
    {
      "pattern": "**/*",
      "headers": [
        {
          "key": "Strict-Transport-Security",
          "value": "max-age=31536000; includeSubDomains"
        }
      ]
    }
  ],
  "rewrites": [
    {
      "source": "/api/<*>",
      "target": "https://dejvzlgtkqd2u.cloudfront.net/api/<*>",
      "status": "200",
      "condition": null
    },
    {
      "source": "/<*>",
      "target": "/index.html",
      "status": "200",
      "condition": null
    }
  ]
}
# Trigger rebuild after manual console configuration fixes.

